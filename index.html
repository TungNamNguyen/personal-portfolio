<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Tung Nguyen's Portfolio</title>
    <meta
      name="description"
      content="Portfolio of Tung Nguyen, a Data and Analytics Engineer building data pipelines, warehouses, and business intelligence."
    />
    <!--
      Two formats on purpose. The SVG is the crisp one, but `image/svg+xml` is a
      MIME type corporate proxies and several content blockers drop outright, and
      a blocked favicon leaves the tab showing a blank sheet. The .ico sits at the
      root path browsers fall back to on their own, so the raster copy is picked
      up whether or not the SVG ever arrives.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Fonts. Linked here rather than @import-ed from index.css so the preload
      scanner sees them while the HTML is still streaming, instead of only after
      the app stylesheet has downloaded and parsed. Two origins are involved —
      googleapis.com serves the CSS, gstatic.com the font files — so both are
      warmed up front. Only the weights actually used: Inter 400/500/600/700,
      JetBrains Mono 400/600/700.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap"
    />

    <!--
      The hero portrait, the largest thing above the fold. Without this it is
      only requested once React has mounted — i.e. after the whole bundle has
      downloaded, parsed and run. Preloading lets it travel alongside the JS.
    -->
    <link rel="preload" as="image" href="/106413417.jpeg" fetchpriority="high" />

    <!--
      Link previews. The crawlers behind LinkedIn, Slack and the rest never run
      the bundle, so whatever they show has to be spelled out here. og:image has
      to be an absolute URL — a relative path is ignored by most of them, which
      is what leaves a summary_large_image card rendering as an empty strip.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tungnguyen-portfolio.vercel.app/" />
    <meta property="og:title" content="Tung Nguyen's Portfolio" />
    <meta
      property="og:description"
      content="Portfolio of Tung Nguyen, a Data and Analytics Engineer building data pipelines, warehouses, and business intelligence."
    />
    <meta property="og:image" content="https://tungnguyen-portfolio.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Tung Nguyen, Data and Analytics Engineer, Hanoi, Vietnam"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Applies the stored theme before first paint so dark-mode visitors never
      see a flash of the light theme. Must stay inline and ahead of the bundle.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark =
            stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* localStorage unavailable (private mode) — fall back to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
