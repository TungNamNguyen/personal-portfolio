<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Tung Nguyen's Portfolio</title>
    <meta
      name="description"
      content="Portfolio of Tung Nguyen, a Data and Analytics Engineer building data pipelines, warehouses, and business intelligence."
    />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />

    <!--
      Link previews. The crawlers behind LinkedIn, Slack and the rest never run
      the bundle, so whatever they show has to be spelled out here. og:image has
      to be an absolute URL — a relative path is ignored by most of them, which
      is what leaves a summary_large_image card rendering as an empty strip.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://personal-portfolio.vercel.app/" />
    <meta property="og:title" content="Tung Nguyen's Portfolio" />
    <meta
      property="og:description"
      content="Portfolio of Tung Nguyen, a Data and Analytics Engineer building data pipelines, warehouses, and business intelligence."
    />
    <meta property="og:image" content="https://personal-portfolio.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Tung Nguyen, Data and Analytics Engineer, Hanoi, Vietnam"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Applies the stored theme before first paint so dark-mode visitors never
      see a flash of the light theme. Must stay inline and ahead of the bundle.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark =
            stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* localStorage unavailable (private mode) — fall back to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
